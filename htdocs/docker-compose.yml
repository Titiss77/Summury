version: '3.8'

name: titiss.space

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html # Synchronise ton code en temps réel avec le conteneur
      - /var/www/html/vendor
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: titiss.space
      MYSQL_DATABASE: titiss.space
      MYSQL_USER: titiss.space
      MYSQL_PASSWORD: titiss.space
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # Permet de ne pas perdre les données quand on coupe Docker

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: